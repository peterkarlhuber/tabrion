name: Bug report
description: Something in Tabrion does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not belong here; see SECURITY.md. Remove passwords, connection strings and data values from everything you paste.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short script, ideally against SQLite or a throwaway PostgreSQL database.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full exception or output
      render: text
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: "e.g. SQLite 3.46, PostgreSQL 17.2"
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `python -c "import sys, tabrion; print(sys.version, tabrion.__version__)"` and `pip show psycopg sqlalchemy alembic`.
      render: text
    validations:
      required: true
