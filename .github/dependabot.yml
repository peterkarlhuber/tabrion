# Conservative update policy (05 section 2.8): grouped weekly pull requests for Python dependencies and for GitHub
# Actions (the workflows pin every action by commit SHA; Dependabot keeps those pins current). Major versions of
# psycopg, SQLAlchemy and Alembic change the supported ranges in pyproject.toml and are reviewed by hand.
# cooldown: a new release is proposed only after a few days (a week for majors), so a broken or compromised release
# is usually withdrawn before it reaches a pull request; security updates are not delayed. No auto-merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: psycopg
        update-types: [version-update:semver-major]
      - dependency-name: sqlalchemy
        update-types: [version-update:semver-major]
      - dependency-name: alembic
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
