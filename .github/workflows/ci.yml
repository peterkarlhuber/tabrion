name: CI

# TAB-004 (05 section 2.5, 07 section 4.2). Every job name below is a mandatory check in .github/ci-manifest.json;
# ci-ok.yml aggregates them. Actions are pinned by commit SHA and images by digest (TAB-T-181,
# tests/security/test_workflow_pins.py). "conformance" (TAB-050), "golden files" (TAB-022) and "examples" (RA-A,
# RA-B) run their suites in a job of their own (TODO TB-092, TB-070, TB-010); the same tests also run in "test" and "pg".
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The nightly (nightly.yml) runs this workflow once a night on master.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the older run of that pull request; every other run gets its own group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src tests scripts
      # AC-1 (QA-16): the import contracts in pyproject.toml ([tool.importlinter], edge list K-33).
      - run: lint-imports
      # CI-FAST: the manifest, the workflow files and ci-ok.yml agree.
      - run: python3 -I .github/scripts/ci_ok.py --self-check --root .
      # The tests of every .github/scripts helper (ci-ok, release_check, coverage_floors).
      - run: python3 -I -m unittest discover -s .github/scripts -p "test_*.py"

  test:
    name: test (Python ${{ matrix.python-version }}${{ matrix.sqlalchemy && format(', SQLAlchemy {0}', matrix.sqlalchemy) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        sqlalchemy: [""]
        include:
          # 05 section 2.4: SQLAlchemy 2.0.x next to the current 2.1.x (the other entries).
          - python-version: "3.12"
            sqlalchemy: "2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - if: matrix.sqlalchemy
        run: pip install "sqlalchemy~=${{ matrix.sqlalchemy }}.0"
      - run: pip list
      # The PostgreSQL tests run in the pg jobs, the packaging tests in "build and install" and "extras matrix", the
      # slow mutation probes in "mutation probes" (K1: unit suite under 60 s), the coverage floors in "coverage".
      - run: >-
          pytest -m "not postgres and not packaging" --ignore-glob="tests/*/test_*mutation_probes*.py"
          --durations=10

  lowest-versions:
    name: test (lowest supported dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # The lower bounds of pyproject.toml (05 section 2.4); psycopg-binary is pinned by name to match psycopg.
      - run: pip install "psycopg==3.2.0" "psycopg-binary==3.2.0" "sqlalchemy==2.0.30" "alembic==1.13.0" "pytest==8.0.0"
      - run: pip list
      - run: pytest -m "not postgres and not packaging" -p no:cacheprovider

  core-no-extras:
    name: core without extras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # The core and pytest only (05 section 2.3).
      - run: pip install . "pytest==9.2.0"
      - run: python -c "import importlib.util as u; assert all(u.find_spec(n) is None for n in ('psycopg', 'sqlalchemy', 'alembic'))"
      - run: pytest tests/packaging/core_without_extras.py -v -p no:cacheprovider
      # The core suite under the meta-path blockade of the extras (AC-3).
      - run: >-
          python -m pytest -p tests.packaging.block_extras -p no:cacheprovider
          tests/unit/test_import_isolation.py tests/packaging/test_isolation_probe.py

  extras:
    name: extras matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install "build==1.6.1" "pytest==9.2.0"
      - run: python -m build --outdir dist
      # TAB-005: every extras combination in a fresh virtual environment from the built wheel.
      - run: pytest -m packaging tests/packaging/test_extras_matrix.py -v -p no:cacheprovider
        env:
          TABRION_DIST: dist

  pg:
    name: pg (${{ matrix.label }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        label: [PostgreSQL 16, PostgreSQL 17, PostgreSQL 18, pgvector 17]
        python: ["3.11", "3.14"]
        include:
          - label: PostgreSQL 16
            image: postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # postgres:16
            major: "16"
            pgvector: "0"
          - label: PostgreSQL 17
            image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
            major: "17"
            pgvector: "0"
          - label: PostgreSQL 18
            image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # postgres:18
            major: "18"
            pgvector: "0"
          - label: pgvector 17
            image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8 # pgvector/pgvector:pg17
            major: "17"
            pgvector: "1"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: tabrion-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TABRION_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=tabrion-ci dbname=postgres
      TABRION_REQUIRE_POSTGRES: "1"
      TABRION_EXPECT_SERVER_MAJOR: ${{ matrix.major }}
      TABRION_REQUIRE_PGVECTOR: ${{ matrix.pgvector }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The PostgreSQL suites of M2 (superuser and runtime-role mode) join tests/postgres.
      - run: pytest -m postgres -v -p no:cacheprovider

  security:
    name: security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      # K8: TAB-T-181 (actions by SHA, images by digest) now; leak, permission and symlink tests join with M2.
      - run: pytest -m security -v -p no:cacheprovider
      # K8: ruff's flake8-bandit rules (S) are the Bandit substitute (CONTRIBUTING.md, "Security lint"), over the
      # package and the reference applications (TM-01, TAB-T-101: S608 in src/ and examples/).
      - run: ruff check --select S src examples

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      # AC-1 (QA-16): contracts kept and the mutation probe red for every forbidden edge; AC-3: blocked modules.
      - run: lint-imports
      - run: pytest tests/architecture tests/unit/test_import_isolation.py tests/packaging/test_isolation_probe.py -v

  packaging:
    name: build and install (fresh virtual environments)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "build==1.6.1" "pytest==9.2.0" "twine==7.0.0"
      - run: python -m build --outdir dist
      - run: twine check --strict dist/*
      - run: pytest -m packaging tests/packaging/test_artifacts.py -v -p no:cacheprovider
        env:
          TABRION_DIST: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mkdocs build --strict

  api-surface:
    # TAB-023 (G-T1 condition C-6): every public signature equals docs/api/surface.json, and no name whose `since` is
    # newer than the package version is exported. On a pull request also S-6 of the API stability policy (TAB-051,
    # TODO TB-090): every surface change since the merge base with the base branch is named in the CHANGELOG.
    name: api surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that the merge base with the base branch exists locally.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - if: github.event_name != 'pull_request'
        run: python scripts/api_surface.py
      - if: github.event_name == 'pull_request'
        name: api_surface.py --base <merge base with the base branch>
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "merge base with the base branch: $base"
          # Transitional until TAB-051 (#21) is on master (TODO TB-017, workflow review C-2). The decision comes from
          # the BASE branch: once its api_surface.py has --base, the check is required, so a pull request that drops
          # the option fails (argparse refuses --base). Only while the base lacks it may the PR's own script decide.
          # Captured first: with pipefail, `grep -q` closing a pipe early would make the test fail open.
          base_script=$(git show "$base:scripts/api_surface.py" 2>/dev/null || true)
          head_help=$(python scripts/api_surface.py --help)
          if grep -q -- '"--base"' <<<"$base_script"; then
            python scripts/api_surface.py --base "$base"
          elif grep -q -- '--base' <<<"$head_help"; then
            python scripts/api_surface.py --base "$base"
          else
            echo "::notice::scripts/api_surface.py has no --base option yet, on the base nor here (TAB-051); plain check"
            python scripts/api_surface.py
          fi

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Every optional extra and the development toolchain.
      - run: pip install "pip-audit==2.10.1" -e ".[dev]"
      - run: pip-audit --skip-editable --progress-spinner off

  conformance:
    # TAB-050 (TODO TB-092, deviation D-92): the Levuvo Database Profile vectors, local and against PostgreSQL, and
    # the check of conformance/MANIFEST.json (file hashes, digest named in CHANGELOG.md).
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: tabrion-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TABRION_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=tabrion-ci dbname=postgres
      TABRION_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that the guard below can read the base branch's tree.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: The vectors exist on this commit (required once they exist on the base)
        id: vectors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          # Transitional until TAB-050 (#27) is on master (TODO TB-017, workflow review C-2). The decision comes from
          # the base: when the base has conformance/MANIFEST.json, this commit must have it too, so a pull request
          # that deletes it fails instead of skipping. Without a base (dispatch, nightly) only this commit counts.
          on_base=false
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              && git cat-file -e "$BASE_SHA:conformance/MANIFEST.json" 2>/dev/null; then
            on_base=true
          fi
          if [ -f conformance/MANIFEST.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$on_base" = true ]; then
            echo "::error::conformance/MANIFEST.json exists on the base $BASE_SHA but not on this commit"
            exit 1
          else
            echo "::notice::conformance/MANIFEST.json does not exist on the base nor here yet (TAB-050); nothing to run"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.vectors.outputs.present == 'true'
        run: pip install -e ".[dev]"
      - if: steps.vectors.outputs.present == 'true'
        run: python -m tests.support.conformance
      - if: steps.vectors.outputs.present == 'true'
        run: pytest -m conformance -v -p no:cacheprovider

  golden:
    # TAB-022a (TODO TB-070, specification S-7, contract I-61): the consumers' golden files, replayed without and
    # with a server.
    name: golden files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: tabrion-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TABRION_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=tabrion-ci dbname=postgres
      TABRION_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_golden_consumers.py tests/postgres/test_golden_consumers.py -v -p no:cacheprovider

  examples:
    # RA-A, RA-B (TODO TB-010): the reference applications under examples/ and their tests in tests/examples, with a
    # server for the PostgreSQL parts (RA-B-2, RA-A-*).
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: tabrion-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TABRION_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=tabrion-ci dbname=postgres
      TABRION_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/examples -v -p no:cacheprovider

  mutation-probes:
    # The mutation probes (a mutated copy of a module must turn its test red) of layer A, layer B and SQLite, split out
    # of "test" so that the unit suite stays near the 60 s of K1 (planning document 07). The PostgreSQL probes also
    # run in every "pg" job.
    name: mutation probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: tabrion-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TABRION_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=tabrion-ci dbname=postgres
      TABRION_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_mutation_probes.py tests/unit/test_mutation_probes_layer_b.py tests/sqlite/test_mutation_probes_sqlite.py tests/postgres/test_postgres_mutation_probes.py -p no:cacheprovider

  coverage:
    # K1 (planning document 07): branch coverage of the whole suite with PostgreSQL, the total and per-module floors.
    # The floors are the measured values of 2026-11-08 (total 94.05 %, errors 95.00 %, sql 100 %, sqlite 94.94 %),
    # rounded down; K1 asks for errors, sql and sqlite >= 95 % (sqlite is 0.06 points short, TODO TB-017). Lowering a
    # floor changes this file, so it needs the workflow-change review. Mutation probes add no coverage and run apart.
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: tabrion-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TABRION_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=tabrion-ci dbname=postgres
      TABRION_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -m "not packaging" --ignore-glob="tests/*/test_*mutation_probes*.py" -p no:cacheprovider
          --cov=tabrion --cov-branch --cov-report=term-missing:skip-covered --cov-report=json:coverage.json
      - name: Coverage floors (total and per module)
