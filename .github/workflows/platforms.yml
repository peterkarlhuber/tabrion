name: Platforms

# 05 section 2.5: the SQLite suite on macOS and Windows (other SQLite builds; Windows has no O_NOFOLLOW). On pull
# requests only when SQLite code or tests change (the manifest's path_filters copy this filter); nightly always.
on:
  pull_request:
    paths:
      - "src/tabrion/sqlite.py"
      - "tests/sqlite/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: sqlite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
      - run: python -m pytest -m "not postgres and not packaging" -p no:cacheprovider
