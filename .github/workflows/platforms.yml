name: Platforms

# 05 section 2.5: the SQLite suite on macOS and Windows (other SQLite builds; Windows has no O_NOFOLLOW). On pull
# requests only when SQLite code or tests, the modules and metadata they depend on (TODO TB-021), the LDP vectors
# (TAB-050 review H-1), the Windows-specific paths of the downstream runner and golden replay (TB-134), the skip
# guard and its allowlist (TB-141) or this workflow change; the manifest's path_filters copy this filter. Nightly
# always.
on:
  pull_request:
    paths:
      - ".github/workflows/platforms.yml"
      - "conformance/**"
      - "pyproject.toml"
      - "scripts/downstream.py"
      - "src/tabrion/__init__.py"
      - "src/tabrion/check.py"
      - "src/tabrion/config.py"
      - "src/tabrion/errors.py"
      - "src/tabrion/sqlite.py"
      - "src/tabrion/testing/sqlite.py"
      - "tests/ci/**"
      - "tests/conformance/**"
      - "tests/conftest.py"
      - "tests/sqlite/**"
      - "tests/unit/test_downstream.py"
      - "tests/unit/test_golden_consumers.py"
      - "tests/unit/test_mutation_probes.py"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# TB-141 (07 section 4.3, G-T2): every pytest run fails on a skip or non-strict xfail reason that is not in the
# reviewed allowlist tests/ci/skip-reasons.txt and lists its skipped node IDs (tests/ci/skipguard.py, loaded by
# tests/conftest.py).
env:
  TABRION_SKIP_GUARD: "1"

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: sqlite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
      - run: python -m pytest -m "not postgres and not packaging" -p no:cacheprovider
