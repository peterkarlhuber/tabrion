# Builds and verifies a Tabrion release from an existing tag. It NEVER publishes on its own.
#
# * Manual only (workflow_dispatch; only users with write access can start it). Nothing here runs on pushes, tags,
#   pull requests or published GitHub releases.
# * Publishing (PyPI, GitHub release, any public announcement) needs the owner's approval G-R for every single
#   version (00 section 13, E-PyPI; stop criterion ST-6). The PyPI path is work package TAB-043, bound to G-R.
#   Until then the job "publish" contains no upload step: it stops with an error, and it runs only when the
#   "publish" input is set AND the protected environment "pypi" (required reviewer: the owner) approves the job.
# * Least privilege (G-T1 condition C-8, F-07): only the small job "attest" holds `id-token: write`. It runs no
#   third-party Python code (no pip install); it downloads the built files and attests them. The job "build" runs pip
#   and the packaging tests with `contents: read` only, so it can never mint an OIDC token.
# * Tabrion is consumed through Git SHA pins; no PyPI publication is planned (owner decision of 2026-11-08 11:26Z,
#   TODO TB-016). Only if one is decided later does the job "publish" need the environment "pypi" (owner action O-2,
#   optional until then; ADR 0009, section "Release environment"): the owner as required reviewer, "prevent
#   self-review" on, deployment refs restricted to the tag pattern `v*`, and the PyPI trusted publisher (TAB-043)
#   naming this file and that environment, so a token for an upload exists only in an approved job of it.
# * The job "downstream-notice" (TAB-051, TODO TB-090) runs `scripts/api_surface.py --base <previous tag>` and prints
#   the downstream issues of the release flow (docs/development/api-stability.md) as a checklist. It opens no issue
#   and holds no write permission: sending them is a manual step after G-R.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag on a master merge commit, e.g. v0.1.0
        required: true
        type: string
      publish:
        description: Request publication (refused until TAB-043 is approved under G-R)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nightly-gate:
    # No release build unless the latest completed nightly (nightly.yml on master) passed within 36 hours.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: The latest nightly of this repository passed within 36 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=master&status=completed&per_page=1" > nightly.json
          python3 -I - nightly.json <<'PY'
          import datetime, json, sys
          runs = json.load(open(sys.argv[1])).get("workflow_runs") or []
          if not runs:
              sys.exit("::error::no completed nightly.yml run on master")
          run = runs[0]
          started = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - started
          print(f"nightly {run['html_url']} {run['conclusion']}, started {run['created_at']} ({age} ago)")
          if run["conclusion"] != "success":
              sys.exit(f"::error::the latest nightly did not pass ({run['conclusion']}): {run['html_url']}")
          if age >= datetime.timedelta(hours=36):
              sys.exit(f"::error::the latest nightly is older than 36 hours: {run['html_url']}")
          PY

  downstream-notice:
    # Release flow steps 1 and 3 of docs/development/api-stability.md as a dry run (TODO TB-090): the S-6 check
    # against the previous tag, then the consumer issues printed to the job summary. Nothing leaves the repository.
    needs: nightly-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: api_surface.py --base <previous tag> and the downstream checklist (dry run)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v*' "refs/tags/$TAG^" 2>/dev/null || true)
          # Informational here: at the tag the entries sit in the version's CHANGELOG section, while --base reads
          # [Unreleased]. The binding S-6 check is the "api surface" job of each pull request and release-flow step 1
          # before tagging; a difference is printed as a warning and does not stop the build.
          if [ -z "$previous" ]; then
            echo "::notice::no release tag before $TAG; nothing to compare"
          elif ! python scripts/api_surface.py --base "$previous"; then
            echo "::warning::api_surface.py --base $previous lists surface changes; check that CHANGELOG.md names each one under $TAG"
          fi
          {
            echo "### Downstream notice for $TAG (dry run, nothing was sent)"
            echo
            echo "Compared with: ${previous:-no earlier tag}. If this release deprecates, removes or tightens something"
            echo "(S-3, S-5, S-8), open by hand, after G-R, one issue titled \`Tabrion ${TAG#v}: deprecations and removals\`"
            echo "listing each Deprecated, Removed and Security entry of CHANGELOG.md with its replacement and removal version, in:"
            echo
            for repo in axentra orkexa nodestro-runtime; do echo "- [ ] peterkarlhuber/$repo"; done
            for repo in nodestro-api nodestro-sdk tabrion-studio; do echo "- [ ] peterkarlhuber/$repo (where it uses the name)"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: nightly-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag is annotated, on master, and matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$TAG" origin/master || { echo "::error::$TAG is not on master"; exit 1; }
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/tabrion/_version.py').read()).group(1))")
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match version $version"; exit 1; }
      - run: pip install "build==1.6.1" "pytest==9.2.0" "twine==7.0.0"
      - run: python -m build --outdir dist
      - run: twine check --strict dist/*
      - run: pytest -m packaging tests/packaging -v -p no:cacheprovider
        env:
          TABRION_DIST: dist
      - name: SHA-256 of the artifacts
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  attest:
    # Build provenance for exactly the files of "build". The only job with an OIDC token; no checkout, no pip.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # build provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  publish:
    needs: [build, attest]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - name: Publishing is not set up (G-R, TAB-043)
        run: |
          echo "::error::Publishing needs the owner's approval G-R for this version and work package TAB-043 (PyPI trusted publisher). This workflow uploads nothing."
          exit 1
