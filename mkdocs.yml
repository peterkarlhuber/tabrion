site_name: Tabrion
site_description: Safe, model-neutral database building blocks for Python applications on SQLite and PostgreSQL.
repo_url: https://github.com/peterkarlhuber/tabrion
repo_name: peterkarlhuber/tabrion
copyright: Copyright &copy; 2026 Levuvo. All rights reserved.
strict: true

theme:
  name: material
  logo: assets/branding/tabrion-mark-on-dark-128.png  # the header bar is dark slate in both schemes
  favicon: assets/branding/favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/tabrion.css

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - SQLite: guides/sqlite.md
      - PostgreSQL: guides/postgresql.md
      - Database and Profile (layer B): guides/database.md
      - Transactions: guides/transactions.md
      - "Query, stream, cancel and inspect (0.2)": guides/studio-apis.md
      - "Profile files and schema fingerprints (0.2)": guides/profiles-and-schema.md
      - Errors: guides/errors.md
      - Splitting SQL scripts: guides/sql.md
      - Connection URLs and secrets: guides/config.md
      - Migrations: guides/migrations.md
      - Diagnosis: guides/check.md
      - Testing: guides/testing.md
      - Portability: guides/portability.md
      - Security: guides/security.md
      - PostgreSQL infrastructure baseline: guides/infrastructure-baseline.md
      - Existing platforms: guides/integration-existing-platforms.md
      - Troubleshooting: guides/troubleshooting.md
  - Specification: specification.md
  - API contract: api/contract.md
  - API consumers: api-consumers.md
  - Development:
      - API stability policy: development/api-stability.md
  - Architecture decisions:
      - adr/README.md
      - "0001 Standalone library": adr/0001-standalone-library.md
      - "0002 Two layers, one distribution": adr/0002-two-layers-one-distribution.md
      - "0003 Existing platforms use layer A": adr/0003-existing-platforms-layer-a.md
      - "0004 Error model": adr/0004-error-model.md
      - "0005 SQLite profile": adr/0005-sqlite-profile.md
      - "0006 PostgreSQL session profile": adr/0006-postgres-session-profile.md
      - "0007 No shared migration runner": adr/0007-no-shared-migration-runner.md
      - "0008 Dependency principles and edges": adr/0008-dependency-principles-and-edges.md
      - "0009 Distribution and versioning": adr/0009-distribution-and-versioning.md
      - "0010 Model neutrality": adr/0010-model-neutrality.md
      - "0011 LDP internal, T-NOTX": adr/0011-ldp-internal-and-t-notx.md
      - "0012 Architecture checks": adr/0012-architecture-checks.md
      - "0013 Axentra adopts Tabrion": adr/0013-axentra-adopts-tabrion.md
      - "0014 Tabrion scope for CR-DBX": adr/0014-crdbx-tabrion-scope.md
  - Program:
      - Status: program/STATUS.md
      - Risks and rollback: program/risks.md
      - TAB-T traceability: program/traceability.md
      - "Report: name check": program/reports/name-check.md
      - "Report: QA-22 conventions audit": program/reports/qa-22-conventions.md
      - "Report: QA-8 supply chain": program/reports/qa-8-supply-chain.md
      - Open work: TODO.md
